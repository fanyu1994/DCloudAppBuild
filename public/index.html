<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DCloud App 本地云打包</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f3f5f7; color: #2c3e50; min-height: 100vh; }
  .container { width: 80vw; max-width: 80vw; margin: 0 auto; padding: 24px 0 60px; }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 22px; }
  header .hint { color: #8a94a6; font-size: 13px; }
  .banner { background: #fff7e6; border: 1px solid #ffd591; color: #ad6800; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; font-size: 13px; line-height: 1.7; display: none; }
  .banner code { background: rgba(0,0,0,.06); padding: 1px 6px; border-radius: 4px; font-size: 12px; word-break: break-all; }
  .card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.06); margin-bottom: 20px; }
  .card h2 { font-size: 15px; margin-bottom: 14px; color: #344563; }
  .form-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  label { font-size: 13px; color: #5e6c84; }
  select, .btn { height: 36px; border-radius: 6px; font-size: 14px; }
  select { border: 1px solid #dfe1e6; padding: 0 10px; background: #fff; }
  .file-box { flex: 1; min-width: 220px; border: 1.5px dashed #c1c7d0; border-radius: 8px; padding: 10px 14px; font-size: 13px; color: #5e6c84; cursor: pointer; transition: border-color .15s; }
  .file-box:hover, .file-box.drag { border-color: #4c9aff; color: #4c9aff; }
  .file-box input { display: none; }
  .btn { border: none; background: #0052cc; color: #fff; padding: 0 22px; cursor: pointer; }
  .btn:disabled { background: #a5adba; cursor: not-allowed; }
  .btn.sm { height: 28px; padding: 0 12px; font-size: 12px; border-radius: 5px; }
  .btn.ghost { background: #ebecf0; color: #42526e; }
  .progress { height: 6px; background: #ebecf0; border-radius: 3px; margin-top: 12px; overflow: hidden; display: none; }
  .progress i { display: block; height: 100%; width: 0; background: #0052cc; transition: width .2s; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: center; padding: 10px 8px; border-bottom: 1px solid #ebecf0; white-space: nowrap; }
  th { color: #6b778c; font-weight: 500; font-size: 12px; }
  td.name { max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
  td.desc { width: 34%; padding-left: 16px; padding-right: 16px; }
  .desc-text { max-width: 520px; white-space: normal; word-break: break-word; line-height: 1.6; }
  .machine { display: inline-block; max-width: 150px; overflow: hidden; text-overflow: ellipsis; vertical-align: top; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px; }
  .badge.queued { background: #ebecf0; color: #42526e; }
  .badge.preparing, .badge.building { background: #deebff; color: #0747a6; }
  .badge.building::after { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #0747a6; margin-left: 5px; animation: blink 1s infinite; }
  .badge.success { background: #e3fcef; color: #006644; }
  .badge.failed { background: #ffebe6; color: #bf2600; }
  @keyframes blink { 50% { opacity: .15; } }
  .ops { display: flex; justify-content: center; align-items: center; gap: 8px; }
  .ops a, .ops button { margin-right: 0; }
  .empty { text-align: center; color: #97a0af; padding: 30px 0; font-size: 13px; }
  .log-mask { position: fixed; inset: 0; background: rgba(9,30,66,.5); display: none; align-items: center; justify-content: center; z-index: 10; }
  .log-box { background: #fff; width: min(860px, 92vw); max-height: 82vh; border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; }
  .log-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #ebecf0; font-size: 14px; }
  .log-box pre { flex: 1; overflow: auto; padding: 14px 16px; font-size: 12px; line-height: 1.6; background: #172b4d; color: #d6e0f0; white-space: pre-wrap; word-break: break-all; }
  .msg { font-size: 12px; color: #6b778c; margin-top: 2px; white-space: normal; }
  .pager { display: flex; align-items: center; gap: 6px; padding: 12px 0 4px; font-size: 12px; color: #42526e; }
  .pager .hint { margin-right: auto; }
  .pager button { min-width: 30px; }
  .pager button.active { background: #0052cc; color: #fff; border-color: #0052cc; }
  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .card-head h2 { margin-bottom: 0; }
  input[type=checkbox] { width: 14px; height: 14px; cursor: pointer; accent-color: #0052cc; vertical-align: middle; }
  textarea { width: 100%; margin-top: 12px; min-height: 62px; border: 1px solid #dfe1e6; border-radius: 6px; padding: 8px 10px; font-size: 13px; font-family: inherit; color: #2c3e50; resize: vertical; }
  textarea:focus { outline: none; border-color: #4c9aff; }
  .remark-box { position: relative; margin-top: 12px; }
  .remark-box textarea { margin-top: 0; padding-right: 58px; }
  .remark-box .counter { position: absolute; right: 10px; bottom: 8px; font-size: 12px; color: #97a0af; pointer-events: none; }
  .detail { padding: 16px; font-size: 13px; overflow: auto; max-height: 72vh; }
  .detail dl { display: grid; grid-template-columns: 84px 1fr; gap: 10px 12px; align-items: start; }
  .detail dt { color: #6b778c; }
  .detail dd { color: #2c3e50; word-break: break-all; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>DCloud App 云端打包</h1>
    <span class="hint">上传本地打包资源 → 自动构建 → 下载 APK</span>
    <span style="flex:1"></span>
    <button class="btn sm ghost" onclick="$('adbMask').style.display='flex'">无线连接手机</button>
  </header>

  <div class="banner" id="sdkBanner"></div>

  <div class="card">
    <h2>上传资源包</h2>
    <div class="form-row">
      <label class="file-box" id="fileBox">
        <input type="file" id="fileInput" accept=".zip">
        <span id="fileName">点击选择或拖拽 ZIP 文件到此处</span>
      </label>
      <label>构建类型
        <select id="buildTypeSel">
          <option value="debug">Debug</option>
          <option value="release">Release</option>
        </select>
      </label>
      <button class="btn" id="uploadBtn">开始构建</button>
    </div>
    <div class="remark-box">
      <textarea id="remarkInput" maxlength="200" placeholder="本次构建说明(可选),例如:修复登录问题,给测试同事验证"></textarea>
      <span class="counter" id="remarkCount">0/200</span>
    </div>
    <div class="progress" id="progress"><i></i></div>
  </div>

  <div class="card">
    <div class="card-head">
      <h2>构建任务</h2>
      <span style="flex:1"></span>
      <button class="btn sm ghost" id="batchDelBtn" disabled onclick="deleteSelected()">批量删除</button>
    </div>
    <table>
      <thead>
        <tr><th style="width:34px"><input type="checkbox" id="checkAll" title="全选本页" onchange="toggleAll(this.checked)"></th><th>时间</th><th>文件</th><th>构建</th><th>状态</th><th>描述</th><th>操作</th></tr>
      </thead>
      <tbody id="taskBody"><tr><td colspan="7" class="empty">暂无任务</td></tr></tbody>
    </table>
    <div class="pager" id="pager"></div>
  </div>
</div>

<div class="log-mask" id="adbMask">
  <div class="log-box" style="max-width:520px">
    <div class="log-head"><span>无线连接手机(Android 11+)</span><button class="btn sm ghost" onclick="$('adbMask').style.display='none'">关闭</button></div>
    <div style="padding:16px;font-size:13px;line-height:1.9;color:#42526e">
      <div>手机操作:<b>设置 → 开发者选项 → 无线调试</b> 开启,手机需与本机在同一局域网。</div>
      <div style="margin:10px 0 4px"><b>第 1 步</b>:手机点「使用配对码配对设备」,把显示的地址和 6 位配对码填到下面:</div>
      <div class="form-row">
        <input id="pairAddr" placeholder="配对地址,如 192.168.1.5:37123" style="flex:2">
        <input id="pairCode" placeholder="配对码" maxlength="6" style="flex:1">
        <button class="btn sm" id="pairBtn" onclick="adbPair()">配对</button>
      </div>
      <div style="margin:12px 0 4px"><b>第 2 步</b>:回到「无线调试」首页,把「IP 地址和端口」填到下面(端口与配对端口不同):</div>
      <div class="form-row">
        <input id="connAddr" placeholder="连接地址,如 192.168.1.5:43215" style="flex:2">
        <button class="btn sm" id="connBtn" onclick="adbConnect()">连接</button>
      </div>
      <div class="msg" id="adbMsg"></div>
      <style>#adbMask input { height:32px;border:1px solid #dfe1e6;border-radius:6px;padding:0 10px;font-size:13px; }</style>
    </div>
  </div>
</div>

<div class="log-mask" id="detailMask">
  <div class="log-box" style="max-width:560px">
    <div class="log-head"><span>任务详情</span><button class="btn sm ghost" onclick="closeDetail()">关闭</button></div>
    <div class="detail" id="detailBody"></div>
  </div>
</div>

<div class="log-mask" id="logMask">
  <div class="log-box">
    <div class="log-head"><span id="logTitle">构建日志</span><button class="btn sm ghost" onclick="closeLog()">关闭</button></div>
    <pre id="logContent"></pre>
  </div>
</div>

<script>
const TYPE_NAMES = { hbx: 'HBuilderX 资源', cli: 'CLI 构建', h5plus: '5+App 项目' };
const STATUS_NAMES = { queued: '排队中', preparing: '准备中', building: '构建中', success: '构建成功', failed: '构建失败' };
const $ = (id) => document.getElementById(id);
let currentLogTask = null;

// SDK 状态
fetch('/api/meta').then(r => r.json()).then(meta => {
  if (!meta.sdkReady) {
    const b = $('sdkBanner');
    b.style.display = 'block';
    b.innerHTML = '⚠️ 尚未配置 DCloud Android 离线 SDK,构建任务将会失败。<br>' +
      '请将离线 SDK 中的 Android 工程(含 <code>gradlew</code>)放到 <code>' + meta.sdkPath + '</code>' +
      ',或设置环境变量 <code>DCLOUD_SDK_ANDROID</code> 后重启服务。';
  }
});

// 文件选择 / 拖拽
const fileInput = $('fileInput'), fileBox = $('fileBox'), fileName = $('fileName');
fileInput.addEventListener('change', () => {
  fileName.textContent = fileInput.files[0] ? fileInput.files[0].name + ' (' + fmtSize(fileInput.files[0].size) + ')' : '点击选择或拖拽 ZIP 文件到此处';
});
['dragover', 'dragenter'].forEach(ev => fileBox.addEventListener(ev, e => { e.preventDefault(); fileBox.classList.add('drag'); }));
['dragleave', 'drop'].forEach(ev => fileBox.addEventListener(ev, e => { e.preventDefault(); fileBox.classList.remove('drag'); }));
fileBox.addEventListener('drop', e => {
  if (e.dataTransfer.files.length) { fileInput.files = e.dataTransfer.files; fileInput.dispatchEvent(new Event('change')); }
});

// 构建说明字数统计(最多 200 字)
const remarkInput = $('remarkInput');
function syncRemarkCount() { $('remarkCount').textContent = remarkInput.value.length + '/200'; }
remarkInput.addEventListener('input', syncRemarkCount);
syncRemarkCount();

// 上传(带进度)
$('uploadBtn').addEventListener('click', () => {
  const file = fileInput.files[0];
  if (!file) return alert('请先选择 ZIP 文件');
  if (!/\.zip$/i.test(file.name)) return alert('仅支持 .zip 文件');
  const fd = new FormData();
  fd.append('file', file);
  fd.append('buildType', $('buildTypeSel').value);
  fd.append('remark', $('remarkInput').value.trim());
  const xhr = new XMLHttpRequest();
  const bar = $('progress'), fill = bar.querySelector('i');
  bar.style.display = 'block'; fill.style.width = '0';
  $('uploadBtn').disabled = true;
  xhr.upload.addEventListener('progress', e => { if (e.lengthComputable) fill.style.width = (e.loaded / e.total * 100) + '%'; });
  xhr.onload = () => {
    $('uploadBtn').disabled = false;
    setTimeout(() => { bar.style.display = 'none'; }, 600);
    if (xhr.status === 201) {
      fileInput.value = ''; fileName.textContent = '点击选择或拖拽 ZIP 文件到此处';
      $('remarkInput').value = '';
      syncRemarkCount();
      loadTasks();
    } else {
      try { alert('上传失败: ' + JSON.parse(xhr.responseText).error); } catch { alert('上传失败(' + xhr.status + ')'); }
    }
  };
  xhr.onerror = () => { $('uploadBtn').disabled = false; alert('网络错误,上传失败'); };
  xhr.open('POST', '/api/upload');
  xhr.send(fd);
});

// 任务列表(带分页 + 批量选择)
let currentPage = 1;
const PAGE_SIZE = 20;
const selected = new Set();

async function loadTasks(page) {
  if (page) currentPage = page;
  let resp;
  try { resp = await (await fetch(`/api/tasks?page=${currentPage}&size=${PAGE_SIZE}`)).json(); } catch { return; }
  const tasks = resp.data || [];
  // 删除末页最后一条后自动回退一页
  if (!tasks.length && currentPage > 1) { currentPage--; return loadTasks(); }
  const body = $('taskBody');
  if (!tasks.length) {
    body.innerHTML = '<tr><td colspan="7" class="empty">暂无任务</td></tr>';
    $('pager').innerHTML = '';
    syncSelectionUI();
    return;
  }
  body.innerHTML = tasks.map(t => {
    const time = new Date(t.createdAt).toLocaleString('zh-CN', { hour12: false });
    let ops = `<button class="btn sm ghost" onclick="showDetail('${t.id}')">详情</button>`;
    ops += `<button class="btn sm ghost" onclick="showLog('${t.id}')">日志</button>`;
    if (t.status === 'success') {
      ops += `<a href="/api/tasks/${t.id}/download"><button class="btn sm">下载 APK</button></a>`;
      ops += `<button class="btn sm ghost" data-install="${t.id}" onclick="installApk('${t.id}', this)">安装</button>`;
    }
    return `<tr>
      <td><input type="checkbox" class="row-check" data-id="${t.id}" onchange="toggleRow(this)"></td>
      <td>${time}</td>
      <td class="name" title="${esc(t.originalName)}">${esc(t.originalName)}<div class="msg">${esc(t.message || '')}</div></td>
      <td>${t.buildType}</td>
      <td><span class="badge ${t.status}">${STATUS_NAMES[t.status] || t.status}</span></td>
      <td class="desc"><div class="desc-text" title="${esc(t.remark || '')}">${esc(t.remark || '-')}</div></td>
      <td class="ops">${ops}</td>
    </tr>`;
  }).join('');
  renderPager(resp.total, resp.page, resp.totalPages);
  syncSelectionUI();
}

// 勾选状态:跨页保留,刷新列表后按 selected 回填
function toggleRow(cb) {
  if (cb.checked) selected.add(cb.dataset.id); else selected.delete(cb.dataset.id);
  syncSelectionUI();
}

function toggleAll(checked) {
  document.querySelectorAll('.row-check').forEach(cb => {
    if (checked) selected.add(cb.dataset.id); else selected.delete(cb.dataset.id);
  });
  syncSelectionUI();
}

function syncSelectionUI() {
  const boxes = Array.from(document.querySelectorAll('.row-check'));
  boxes.forEach(cb => { cb.checked = selected.has(cb.dataset.id); });
  const allChecked = boxes.length > 0 && boxes.every(cb => cb.checked);
  const all = $('checkAll');
  if (all) {
    all.checked = allChecked;
    all.indeterminate = !allChecked && boxes.some(cb => cb.checked);
  }
  const btn = $('batchDelBtn');
  if (btn) {
    btn.disabled = selected.size === 0;
    btn.textContent = selected.size ? `删除选中(${selected.size})` : '批量删除';
  }
}

// 批量删除任务(同时删除日志与 APK,不可恢复)
async function deleteSelected() {
  if (!selected.size) return;
  if (!confirm(`确定删除选中的 ${selected.size} 个任务?\n其构建日志与 APK 文件会一并删除,且不可恢复。`)) return;
  const btn = $('batchDelBtn');
  btn.disabled = true;
  try {
    const resp = await fetch('/api/tasks', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids: Array.from(selected) }),
    });
    const r = await resp.json();
    if (!resp.ok) { alert('删除失败: ' + (r.error || resp.status)); syncSelectionUI(); return; }
    selected.clear();
    await loadTasks();
  } catch (e) {
    alert('删除失败: ' + e.message);
    syncSelectionUI();
  }
}

function renderPager(total, page, totalPages) {
  const p = $('pager');
  if (totalPages <= 1) { p.innerHTML = `<span class="hint">共 ${total} 条</span>`; return; }
  const pages = [];
  const push = (n, label, disabled, active) => pages.push(`<button class="btn sm ghost${active ? ' active' : ''}" ${disabled ? 'disabled' : ''} onclick="${disabled ? '' : `loadTasks(${n})`}">${label}</button>`);
  push(1, '‹', page <= 1);
  // 当前页附近 + 首尾
  const windowSize = 3;
  const lo = Math.max(1, page - windowSize), hi = Math.min(totalPages, page + windowSize);
  if (lo > 1) { push(1, '1'); if (lo > 2) pages.push(`<span class="hint">…</span>`); }
  for (let i = lo; i <= hi; i++) push(i, i, false, i === page);
  if (hi < totalPages) { if (hi < totalPages - 1) pages.push(`<span class="hint">…</span>`); push(totalPages, totalPages); }
  push(page + 1, '›', page >= totalPages);
  p.innerHTML = `<span class="hint">共 ${total} 条</span>${pages.join('')}`;
}

async function showLog(id) {
  currentLogTask = id;
  $('logTitle').textContent = '构建日志 - ' + id;
  $('logMask').style.display = 'flex';
  await refreshLog();
}
async function refreshLog() {
  if (!currentLogTask) return;
  try {
    const text = await (await fetch('/api/tasks/' + currentLogTask + '/log')).text();
    const pre = $('logContent');
    const atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 20;
    pre.textContent = text;
    if (atBottom) pre.scrollTop = pre.scrollHeight;
  } catch {}
}
function closeLog() { currentLogTask = null; $('logMask').style.display = 'none'; }
$('logMask').addEventListener('click', e => { if (e.target === $('logMask')) closeLog(); });

// 任务详情弹窗
function fmtTime(ts) { return ts ? new Date(ts).toLocaleString('zh-CN', { hour12: false }) : '-'; }

async function showDetail(id) {
  const box = $('detailBody');
  $('detailMask').style.display = 'flex';
  box.innerHTML = '<div class="empty">加载中...</div>';
  let t;
  try {
    t = await (await fetch('/api/tasks/' + id)).json();
  } catch (e) {
    box.innerHTML = '<div class="empty">加载失败: ' + esc(e.message) + '</div>';
    return;
  }
  if (t.error) { box.innerHTML = '<div class="empty">' + esc(t.error) + '</div>'; return; }
  const dur = t.finishedAt && t.createdAt ? Math.max(0, Math.round((t.finishedAt - t.createdAt) / 1000)) + ' 秒' : '-';
  const machine = t.machine
    ? `${t.machine.host} / ${t.machine.platform} / ${t.machine.cpu} / ${t.machine.cores} 核 / ${t.machine.memGb} GB`
    : '-';
  const uploader = t.uploader ? `${t.uploader.ip || '-'} (${t.uploader.os || '未知'})` : '-';
  const rows = [
    ['任务 ID', t.id],
    ['文件', t.originalName],
    ['大小', t.size ? fmtSize(t.size) : '-'],
    ['资源类型', t.type ? (TYPE_NAMES[t.type] || t.type) : '未识别'],
    ['appid', t.appid || '-'],
    ['构建类型', t.buildType],
    ['状态', STATUS_NAMES[t.status] || t.status],
    ['构建说明', t.remark || '-'],
    ['提示信息', t.message || '-'],
    ['上传者', uploader],
    ['构建机器', machine],
    ['创建时间', fmtTime(t.createdAt)],
    ['完成时间', fmtTime(t.finishedAt)],
    ['耗时', dur],
    ['APK 文件', t.apkName || '-'],
  ];
  box.innerHTML = '<dl>' + rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('') + '</dl>';
}

function closeDetail() { $('detailMask').style.display = 'none'; }
$('detailMask').addEventListener('click', e => { if (e.target === $('detailMask')) closeDetail(); });

// 安装 APK 到 USB 调试设备(adb 服务跑在宿主机,容器通过 TCP 连接)
async function adbPair() {
  const btn = $('pairBtn'), msg = $('adbMsg');
  btn.disabled = true; msg.textContent = '配对中...';
  try {
    const r = await (await fetch('/api/adb/pair', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ addr: $('pairAddr').value.trim(), code: $('pairCode').value.trim() }),
    })).json();
    if (r.ok) {
      msg.textContent = '配对成功!请完成第 2 步连接。';
      const host = $('pairAddr').value.trim().split(':')[0];
      if (host && !$('connAddr').value) $('connAddr').value = host + ':';
    } else msg.textContent = '配对失败: ' + (r.error || '');
  } catch (e) { msg.textContent = '配对失败: ' + e.message; }
  btn.disabled = false;
}
async function adbConnect() {
  const btn = $('connBtn'), msg = $('adbMsg');
  btn.disabled = true; msg.textContent = '连接中...';
  try {
    const r = await (await fetch('/api/adb/connect', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ addr: $('connAddr').value.trim() }),
    })).json();
    if (r.ok) {
      msg.textContent = '连接成功!现在可以在任务的「安装」按钮里选择这台手机了。';
      setTimeout(() => { $('adbMask').style.display = 'none'; }, 1500);
    } else msg.textContent = '连接失败: ' + (r.error || '');
  } catch (e) { msg.textContent = '连接失败: ' + e.message; }
  btn.disabled = false;
}

// 安装 APK 到 USB 调试设备(adb 服务跑在宿主机,容器通过 TCP 连接)
async function installApk(id, btn) {
  const label = btn.textContent;
  btn.disabled = true;
  try {
    btn.textContent = '检测设备...';
    const devRes = await (await fetch('/api/adb/devices')).json();
    if (devRes.error) throw new Error(devRes.error);
    const devices = devRes.devices || [];
    if (!devices.length) {
      alert('未检测到设备。请确认:\n1. USB 连接:手机已插到构建机并开启调试、已授权\n2. 或使用右上角「无线连接手机」先配对连接(Android 11+)');
      return;
    }
    let serial = devices[0];
    if (devices.length > 1) {
      const pick = prompt('检测到多台设备,输入序号选择:\n' + devices.map((d, i) => `${i + 1}. ${d}`).join('\n'), '1');
      if (pick === null) return;
      serial = devices[parseInt(pick, 10) - 1];
      if (!serial) return alert('序号无效');
    }
    btn.textContent = '安装中...';
    const res = await (await fetch('/api/tasks/' + id + '/install', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ serial }),
    })).json();
    if (res.ok) alert('安装成功: ' + serial);
    else alert('安装失败: ' + (res.error || '未知错误'));
  } catch (e) {
    alert('安装失败: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = label;
  }
}

function fmtSize(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : (n / 1024).toFixed(0) + ' KB'; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

loadTasks();
setInterval(() => { loadTasks(); if (currentLogTask) refreshLog(); }, 3000);
</script>
